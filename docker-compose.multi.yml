# Vibecraft Multi-Instance Docker Compose
#
# Runs the Vibecraft server + Claude worker containers that can run Claude sessions.
# Workers have Claude CLI installed and are pre-configured with vibecraft hooks.
#
# Usage:
#   docker-compose -f docker-compose.multi.yml up -d                    # Start with 3 workers
#   docker-compose -f docker-compose.multi.yml up -d --scale claude-worker=5  # Start with 5 workers
#
# Start a Claude session in a worker:
#   docker exec -it vibecraft-claude-1 claude --dangerously-skip-permissions
#
# Environment variables:
#   ANTHROPIC_API_KEY    - Required for Claude CLI (set in .env or environment)
#   CLAUDE_INSTANCES     - Number of worker containers (default: 3)
#   VIBECRAFT_PORT       - Server port (default: 4003)

version: '3.8'

services:
  # ==========================================================================
  # Vibecraft Hub (Main Server + UI)
  # ==========================================================================
  vibecraft-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibecraft-hub
    ports:
      - "${VIBECRAFT_PORT:-4003}:4003"
    volumes:
      # Shared data volume for events from all workers
      - vibecraft-shared:/data
      # Host hooks directory (read-only)
      - "${HOME}/.vibecraft/hooks:/app/hooks:ro"
    environment:
      - NODE_ENV=production
      - VIBECRAFT_PORT=4003
      - VIBECRAFT_DATA_DIR=/data
      - VIBECRAFT_MODE=hub
      - VIBECRAFT_DEBUG=${VIBECRAFT_DEBUG:-false}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - vibecraft-net
    # Enable host.docker.internal for Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================================
  # Claude Worker Containers
  # ==========================================================================
  # Each worker has Claude CLI installed and can run Claude sessions.
  # Scale with: --scale claude-worker=N
  #
  # To start Claude in a worker:
  #   docker exec -it vibecraft-claude-worker-1 claude
  #
  claude-worker:
    build:
      context: .
      dockerfile: Dockerfile.claude
    volumes:
      # Shared data volume - workers write events here
      - vibecraft-shared:/root/.vibecraft/data:rw
      # Mount a workspace directory for Claude to work in
      - ${CLAUDE_WORKSPACE:-./workspace}:/workspace:rw
    environment:
      # Required: Your Anthropic API key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Vibecraft event notification URL (used by hook script)
      - VIBECRAFT_WS_NOTIFY=http://vibecraft-hub:4003/event
      - VIBECRAFT_ENABLE_WS_NOTIFY=true
      - VIBECRAFT_DATA_DIR=/root/.vibecraft/data
      - NODE_ENV=production
    depends_on:
      vibecraft-hub:
        condition: service_healthy
    networks:
      - vibecraft-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      replicas: ${CLAUDE_INSTANCES:-3}
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    # Enable pseudo-TTY for interactive Claude sessions
    stdin_open: true
    tty: true

# =============================================================================
# Networks
# =============================================================================
networks:
  vibecraft-net:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  vibecraft-shared:
    driver: local
