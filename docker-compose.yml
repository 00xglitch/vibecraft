# Vibecraft Docker Compose Configuration
#
# Basic usage:
#   docker-compose up -d
#
# Development with local data:
#   docker-compose up -d
#
# Production with SSL:
#   docker-compose --profile production up -d

version: '3.8'

services:
  # ==========================================================================
  # Vibecraft Server
  # ==========================================================================
  vibecraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibecraft
    ports:
      - "${VIBECRAFT_PORT:-4003}:4003"
    volumes:
      # Mount host's vibecraft data for persistence
      - "${HOME}/.vibecraft/data:/data:rw"
    environment:
      - NODE_ENV=production
      - VIBECRAFT_PORT=4003
      - VIBECRAFT_DATA_DIR=/data
      - VIBECRAFT_DEBUG=${VIBECRAFT_DEBUG:-false}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4003/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - vibecraft-net

  # ==========================================================================
  # Nginx Reverse Proxy (Production Profile)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: vibecraft-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - vibecraft
    networks:
      - vibecraft-net
    profiles:
      - production
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  vibecraft-net:
    driver: bridge

# =============================================================================
# Named Volumes (Alternative to Host Mount)
# =============================================================================
# Uncomment to use Docker-managed volumes instead of host mounts
# volumes:
#   vibecraft-data:
